# Used only until the first certificate exists, so Let's Encrypt can reach this server.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        default_type text/plain;
        return 503 "HTTPS is being set up. Please try again shortly.\n";
    }
}
