# Request limits per visitor address: pages and actions, and sign-in. Generous, because many staff
# may reach the site from the one campus address.
limit_req_zone $binary_remote_addr zone=perip:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=signin:10m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=conns:10m;
limit_req_status 429;
limit_conn_status 429;

# Slow or oversized requests are dropped instead of tying up the server.
client_header_timeout 15s;
client_body_timeout 30s;
send_timeout 30s;
large_client_header_buffers 4 16k;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Requests for any other name (scanners using the bare IP address) get no certificate and no answer.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_tokens off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_tokens off;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Forward-secret, authenticated ciphers only for TLS 1.2; TLS 1.3 uses its own safe set.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Slightly above the highest upload limit an administrator can set (25 MB).
    client_max_body_size 30m;

    limit_conn conns 300;

    # Only the methods the app uses.
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    # Plain answers instead of the web server's own pages, which name the software.
    error_page 404 /__404;
    error_page 405 /__405;
    error_page 413 /__413;
    error_page 429 /__429;
    error_page 500 502 503 504 /__50x;
    location = /__404 { internal; default_type text/plain; return 404 "Not found\n"; }
    location = /__405 { internal; default_type text/plain; return 405 "Method not allowed\n"; }
    location = /__413 { internal; default_type text/plain; return 413 "The file is too large\n"; }
    location = /__429 { internal; default_type text/plain; return 429 "Too many requests. Please wait a moment and try again.\n"; }
    location = /__50x { internal; default_type text/plain; return 503 "The service is temporarily unavailable. Please try again shortly.\n"; }

    # Hidden files and file types this app never serves.
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(php\d?|aspx?|jsp|cgi|pl|env|ini|sql|bak|old|orig|swp|log|ya?ml|sh)$ { return 404; }

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's name server, so a restarted app container is found again.
    resolver 127.0.0.11 valid=10s;
    set $upstream http://app:3000;

    location /api/auth/ {
        limit_req zone=signin burst=60 nodelay;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Set, not appended: the app and its rate limits must see the real address, not one a visitor made up.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # Nothing in the answer names the software behind it.
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Nextjs-Cache;
        proxy_hide_header X-Nextjs-Prerender;
        proxy_hide_header X-Nextjs-Stale-Time;
        proxy_hide_header X-Nextjs-Matched-Path;
        proxy_read_timeout 120s;
    }

    location / {
        limit_req zone=perip burst=200 nodelay;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Set, not appended: the app and its rate limits must see the real address, not one a visitor made up.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # Nothing in the answer names the software behind it.
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Nextjs-Cache;
        proxy_hide_header X-Nextjs-Prerender;
        proxy_hide_header X-Nextjs-Stale-Time;
        proxy_hide_header X-Nextjs-Matched-Path;
        proxy_read_timeout 120s;
    }
}
